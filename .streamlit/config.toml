# ตั้งค่าธีมของแอป — บังคับให้เป็นโหมดสว่างเสมอ ไม่ว่าเครื่องผู้ใช้จะตั้งเป็นโหมดมืดก็ตาม
# นี่คือสิ่งที่แก้ปัญหา "ตัวหนังสือจาง / ช่องกรอกดำ / อ่านยาก"

[theme]
base = "light"
primaryColor = "#E0533D"            # สีส้มสัญญาณ (ปุ่ม/ไฮไลต์)
backgroundColor = "#FFFFFF"         # พื้นหลังหลัก (ขาว)
secondaryBackgroundColor = "#F1F4F9" # พื้นหลังรอง (เทาอ่อน) เช่น sidebar, การ์ด
textColor = "#14233D"               # สีตัวอักษรหลัก (กรมท่าเข้ม อ่านง่าย)
font = "sans serif"

[client]
toolbarMode = "minimal"             # ซ่อนเมนู Deploy/รก ๆ ด้านบนให้สะอาดตา
