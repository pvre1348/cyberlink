# ธีมมืดสไตล์ ArcGIS Dashboards ของ Esri
# สีฟ้าสัญลักษณ์ Esri #0079C1 เป็นสีนำ, พื้นเข้มไม่ดำสนิทเพื่อไม่ล้าตา

[theme]
base = "dark"
primaryColor = "#0079C1"                # สีฟ้า Esri (ปุ่ม/ไฮไลต์)
backgroundColor = "#1B2735"             # พื้นหลังเนื้อหา (เข้ม-น้ำเงินเทา)
secondaryBackgroundColor = "#172230"    # sidebar และพื้นการ์ด
textColor = "#F0F4F9"                   # ตัวหนังสือหลัก (ขาวออกฟ้าเล็กน้อย)
font = "sans serif"

[client]
toolbarMode = "minimal"
